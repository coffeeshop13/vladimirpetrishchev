name: Generate weekly blog post

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override for this run"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate article
        run: node scripts/generate-post.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
          BLOG_TOPIC: ${{ inputs.topic }}

      - name: Commit generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          if git diff --cached --quiet; then
            echo "No new article to commit."
          else
            git commit -m "Add weekly AI-generated blog post"
            git push origin main
          fi
